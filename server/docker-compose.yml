# 사주믹스 해석 서버.
#
# 공유 서버(blend)에 다른 서비스가 여럿 돈다 — 포트를 **127.0.0.1 에만** 바인딩하고
# Caddy 가 sajumix.kodekorea.kr/api/* 를 여기로 넘긴다. 밖으로 직접 열지 않는다.
services:
  sajumix-interpret:
    build: .
    image: sajumix-interpret:latest
    container_name: sajumix-interpret
    restart: unless-stopped
    # 호스트의 8787 을 루프백에만 연다. 0.0.0.0 으로 열면 방화벽 밖에서 직접 때릴 수 있다.
    ports:
      - '127.0.0.1:8787:8787'
    env_file:
      - ./interpret.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '8787'
      TRUST_PROXY: 'true'
    # 컨테이너가 죽었는지 Caddy 가 알 필요는 없지만, 재시작 판정에 쓴다.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
